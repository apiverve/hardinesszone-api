name: apiverve_hardinesszone
description: "USDA Hardiness Zone looks up the plant hardiness zone by ZIP code, mapping any US ZIP code to its zone title and temperature range. Paid plans add the zone classification code, Celsius values, and plant survival recommendations."
version: 1.2.4
homepage: https://apiverve.com/marketplace/hardinesszone?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/hardinesszone-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
