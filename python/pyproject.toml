[project]
name = "apiverve-usdahardinesszone"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "USDA Hardiness Zone looks up the plant hardiness zone by ZIP code, mapping any US ZIP code to its zone title and temperature range. Paid plans add the zone classification code, Celsius values, and plant survival recommendations."
keywords = ["usda hardiness zone api", "plant hardiness zone api", "usda hardiness zone by zip code", "hardiness zone by zip code", "growing zones by zip code"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/hardinesszone?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/hardinesszone?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/hardinesszone-api"
Twitter = "https://twitter.com/apivervehq"
